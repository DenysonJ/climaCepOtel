services:
  zipkin:
    container_name: zipkin
    image: openzipkin/zipkin:latest
    restart: always
    ports:
      - "9411:9411"

  prometheus:
    container_name: prometheus
    image: prom/prometheus:latest
    restart: always
    volumes:
      - ./.docker/prometheus.yaml:/etc/prometheus/prometheus.yaml
    ports:
      - "9090:9090"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    restart: always
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./.docker/otel-collector-config.yaml:/etc/otel-collector-config.yaml
    ports:
      - "8888:8888"
      - "8889:8889"
      - "4317:4317"
    depends_on:
      - zipkin

  cep:
    container_name: cep
    build:
      context: .
      args:
        SERVICE: cep
    environment:
      - ENVIRONMENT=production
      - WEB_SERVER_PORT=8080
      - EXTERNAL_CALL_URL=http://clima:8181
      - OTEL_SERVICE_NAME=microservice_cep
      - OTEL_EXPORTER_OTLP_ENDPOINT=otel-collector:4317
    ports:
      - "8080:8080"
    depends_on:
      - clima
      - otel-collector

  clima:
    container_name: clima
    build:
      context: .
      args:
        SERVICE: clima
    environment:
      - ENVIRONMENT=production
      - WEB_SERVER_PORT=8181
      - WEATHER_API_KEY=${WEATHER_API_KEY}
      - OTEL_SERVICE_NAME=microservice_clima
      - OTEL_EXPORTER_OTLP_ENDPOINT=otel-collector:4317
    ports:
      - "8181:8181"
    depends_on:
      - otel-collector